extensions:
  oauth2client/client:
    client_id: agent 
    client_secret: t3UArH3Tg9LuzaMZ0BjtLvxnrE6MRvPt
    token_url: http://0.0.0.0:8080/realms/opentelemetry/protocol/openid-connect/token

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: localhost:5317

exporters:
  debug:
  otlp/secure:
    endpoint: localhost:4317
    tls:
      ca_file: ca.pem
      cert_file: client.pem
      key_file: client-key.pem
    auth:
      authenticator: oauth2client/client

service:
  extensions: [oauth2client/client]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp/secure, debug]
  telemetry:
    metrics:
      readers:
        - periodic:
            interval: 15_000
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://localhost:4318
