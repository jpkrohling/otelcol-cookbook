receivers:
  otlp:
    protocols:
      grpc: {}
      http: {}

exporters:
  otlp:
    endpoint: localhost:5317
    tls:
      insecure: true
    sending_queue:
      storage: file_storage
      queue_size: 200_000

extensions:
  file_storage:
    directory: /tmp/otelcol

service:
  extensions: [ file_storage ]
  pipelines:
    traces:
      receivers:  [ otlp  ]
      exporters:  [ otlp  ]
