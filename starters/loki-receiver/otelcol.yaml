extensions:
  basicauth:
    htpasswd:
      inline: admin:supersecret

receivers:
  loki:
    protocols:
      http:
        endpoint: 0.0.0.0:3500
        auth:
          authenticator: basicauth

exporters:
  debug:
    verbosity: detailed

service:
  extensions: [basicauth]
  pipelines:
    logs:
      receivers: [loki]
      exporters: [debug]
