receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  tail_sampling:
    decision_wait: 2s
    num_traces: 10000
    expected_new_traces_per_sec: 100
    policies:
      - name: drop-99-percent-health-checks
        type: drop
        drop:
          drop_sub_policy:
            # Match health-related URL paths
            - name: health-url-path
              type: string_attribute
              string_attribute:
                key: url.path
                values:
                  - "^/health.*"
                  - "^/.*/health.*"
                  - "^/actuator/health.*"
                enabled_regex_matching: true
                cache_max_size: 100

            # Check for HTTP method GET
            - name: http-method-get
              type: string_attribute
              string_attribute:
                key: http.request.method
                values: ["GET"]

            # Check for HTTP status code 200
            - name: http-status-200
              type: numeric_attribute
              numeric_attribute:
                key: http.response.status_code
                min_value: 200
                max_value: 200

            # Drop 99% of matching traces
            - name: drop-99-percent
              type: probabilistic
              probabilistic:
                sampling_percentage: 99.0

      - name: sample-everything-else
        type: always_sample

exporters:
  file:
    path: ./after-sampling.jsonl

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling]
      exporters: [file]
