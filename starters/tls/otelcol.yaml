receivers:
  # plain, unencrypted entry point
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

  # TLS-protected receiver (the "server" side of TLS)
  otlp/secure:
    protocols:
      grpc:
        endpoint: 0.0.0.0:5317
        tls:
          ca_file: ca.pem
          cert_file: server.pem
          key_file: server-key.pem

exporters:
  debug:
    verbosity: detailed

  # TLS-enabled exporter (the "client" side of TLS)
  otlp_grpc/secure:
    endpoint: localhost:5317
    tls:
      ca_file: ca.pem
      cert_file: client.pem
      key_file: client-key.pem

service:
  pipelines:
    # data arrives in the clear and is forwarded over TLS
    traces/insecure-to-secure:
      receivers: [otlp]
      exporters: [otlp_grpc/secure]

    # the TLS receiver accepts it and hands it to the backend
    traces/secure-to-backend:
      receivers: [otlp/secure]
      exporters: [debug]
