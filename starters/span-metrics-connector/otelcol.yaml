receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

connectors:
  span_metrics:
    # emit the generated metrics every 15s (default is 60s)
    metrics_flush_interval: 15s

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    # incoming traces feed the span_metrics connector
    traces:
      receivers: [otlp]
      exporters: [span_metrics]
    # the connector emits RED metrics, which this pipeline prints
    metrics:
      receivers: [span_metrics]
      exporters: [debug]
