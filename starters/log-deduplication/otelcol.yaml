receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Collapse identical log records seen within each interval into a single
  # record carrying a count of how many were merged. `conditions` scopes which
  # records are eligible; `exclude_fields` lists fields ignored when comparing
  # records for equality (so e.g. a per-request id doesn't defeat the dedup).
  log_dedup:
    interval: 5s
    conditions:
      - severity_number >= SEVERITY_NUMBER_ERROR
      - attributes["log.type"] == "connection"
    exclude_fields:
      - attributes.request_id

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [log_dedup]
      exporters: [debug]
