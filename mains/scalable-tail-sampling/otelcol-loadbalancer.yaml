apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otelcol-loadbalancer
spec:
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.159.0
  replicas: 2
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317

    exporters:
      # routes by trace ID so every span of a trace lands on the same sampler
      load_balancing:
        routing_key: traceID
        protocol:
          otlp:
            tls:
              insecure: true
        resolver:
          dns:
            hostname: otelcol-sampling-collector-headless

    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [load_balancing]
      telemetry:
        resource:
          service.name: otelcol-scalable-tail-sampling-loadbalancer
        metrics:
          level: detailed
          readers:
            - periodic:
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://lgtm.lgtm.svc.cluster.local:4318/v1/metrics
                    compression: gzip
