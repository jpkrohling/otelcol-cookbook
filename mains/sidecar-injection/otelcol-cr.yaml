apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: sidecar-for-my-workload
  namespace: sidecar-injection
spec:
  mode: sidecar
  config:
    receivers:
      otlp:
        protocols:
          grpc: {} # in sidecar mode the app reaches this over localhost
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug]
---
# A workload that opts into injection. The Operator adds the collector above
# as an extra container in this pod; the app sends to localhost:4317.
apiVersion: v1
kind: Pod
metadata:
  name: my-microservice
  namespace: sidecar-injection
  annotations:
    sidecar.opentelemetry.io/inject: "sidecar-for-my-workload"
spec:
  containers:
    - name: my-microservice
      image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.155.0
      args:
        - traces
        - --otlp-insecure
        - --otlp-endpoint=localhost:4317
        - --duration=10m
        - --rate=1
