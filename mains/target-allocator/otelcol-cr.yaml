apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: collector-with-ta
spec:
  image: otel/opentelemetry-collector-contrib:0.155.0
  mode: statefulset
  replicas: 3
  targetAllocator:
    enabled: true
    prometheusCR:
      enabled: true
      podMonitorSelector: {}
      serviceMonitorSelector: {}
  config:
    receivers:
      prometheus:
        config:
          scrape_configs: []

    exporters:
      otlp_http:
        endpoint: http://lgtm.lgtm.svc.cluster.local:4318

    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: []
          exporters: [otlp_http]
