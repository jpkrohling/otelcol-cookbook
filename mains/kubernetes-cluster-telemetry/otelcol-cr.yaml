apiVersion: v1
kind: Namespace
metadata:
  name: cluster-telemetry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otelcol-k8s
  namespace: cluster-telemetry
---
# k8s_cluster and k8s_events read cluster-wide objects, so the collector's
# service account needs list/watch across the API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otelcol-k8s
rules:
  - apiGroups: [""]
    resources:
      - events
      - namespaces
      - nodes
      - pods
      - replicationcontrollers
      - resourcequotas
      - services
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otelcol-k8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otelcol-k8s
subjects:
  - kind: ServiceAccount
    name: otelcol-k8s
    namespace: cluster-telemetry
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otelcol-k8s
  namespace: cluster-telemetry
spec:
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.154.0
  serviceAccount: otelcol-k8s
  config:
    receivers:
      k8s_cluster: # cluster-level metrics: pod/node/deployment status, counts
        collection_interval: 15s
      k8s_events: {} # Kubernetes Events as log records
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        metrics:
          receivers: [k8s_cluster]
          exporters: [debug]
        logs:
          receivers: [k8s_events]
          exporters: [debug]
