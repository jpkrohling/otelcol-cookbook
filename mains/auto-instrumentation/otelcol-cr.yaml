---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: my-java
spec:
  env:
    - name: OTEL_TRACES_EXPORTER
      value: otlp
    # the Java agent defaults to OTLP http/protobuf; we send to the gRPC port,
    # so pin the protocol to grpc to match the collector's :4317 receiver
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: grpc
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://auto-instrumentation-collector-headless.auto-instrumentation.svc.cluster.local:4317
  exporter:
    endpoint: http://auto-instrumentation-collector-headless.auto-instrumentation.svc.cluster.local:4317
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: auto-instrumentation
spec:
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.157.0
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317

    exporters:
      debug:
        verbosity: detailed

    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug]
        logs:
          receivers: [otlp]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          exporters: [debug]
