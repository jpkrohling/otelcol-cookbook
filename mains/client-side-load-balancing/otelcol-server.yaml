apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otelcol-server
spec:
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.157.0
  replicas: 3
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            # forcing connections to age out makes clients re-resolve DNS and
            # rebalance as the server pool changes — the key to load spreading
            keepalive:
              server_parameters:
                max_connection_age: 1m

    exporters:
      nop: {}

    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [nop]
        logs:
          receivers: [otlp]
          exporters: [nop]
        metrics:
          receivers: [otlp]
          exporters: [nop]
      telemetry:
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
