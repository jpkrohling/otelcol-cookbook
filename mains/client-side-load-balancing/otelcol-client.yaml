apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otelcol-client
spec:
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.157.0
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317

    exporters:
      otlp_grpc:
        # dns:/// + round_robin makes the gRPC client spread requests across
        # all addresses behind the headless service
        endpoint: dns:///otelcol-server-collector-headless:4317
        balancer_name: round_robin
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [otlp_grpc]
        logs:
          receivers: [otlp]
          exporters: [otlp_grpc]
        metrics:
          receivers: [otlp]
          exporters: [otlp_grpc]
