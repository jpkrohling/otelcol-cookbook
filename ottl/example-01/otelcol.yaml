receivers:
  otlp:
    protocols:
      http:

processors:
  transform:
    trace_statements:
      - context: resource
        statements:
          - delete_key(resource.attributes, "host.ip")
          - delete_key(resource.attributes, "host.mac")

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    metrics:
      receivers:  [ otlp ]
      processors: [ transform ]
      exporters:  [ debug ]
